simu:
  picFile: Datasets_2D_electrostatic_plasma/2D_PIF_5_miniapps_500k.h5
  nDim: 2

sample:
  iEnd: 600
  step: 1

data:
  dataClass: pic
  outType: solution
  outScaling: 1
  space_dim: 2
  xStep: 1
  yStep: 1
  zStep: 1
  seed: null
  dataFile: Datasets_2D_electrostatic_plasma/PIF2D_5_miniapps_500k_QL_normalize.h5
  trainRatio: 0.8
  batchSize:  12        # Global Batch size 
  sampling_mode: None  # [fixed, ordered, random]
 

model:
  da: 2
  du: 2
  dv: 32
  kX: 16
  kY: 16
  kZ: None
  n_dims: 2
  n_layers: 4
  bias: false
  non_linearity: gelu
  scaling_layers: 2
  use_postfnochannel_mlp: false
  channel_mlp_expansion: 4
  use_skip_connection: false
  skip_type: soft-gating
  use_dse: true                        # Direct Spectral Evaluation
  use_kb: false                          # Kaiser-Bessel NUFFT
  use_toeplitz: false                   # Toeplitz NUFFT


optim:
  name: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4

lr_scheduler:
  # scheduler: CosAnnealingLR
  # T_max: 50000
  scheduler: StepLR
  step_size: 50.0
  gamma: 0.5

loss:
  name: L1Loss
  # absolute: false
  
parallel_strategy:
  ddp: true      # Distributed Data Parallel
  tp : true      # Tensor Parallel(Only for PIC-DSE)
  tp_size: 2     # must be divisible by nParticle          
  gpus_per_node: 4

train:
  trainDir: PIF2D_5_miniapps_QL_normalize
  epochs: 250                     # nEpochs
  checkpoint: None  
  saveInterval: 50
  disableTensorboard: true

eval:
  runId: 1
  imgExt: png
  evalDir: eval2D_PIF_5_miniapps
  dim: 2
  kc : 0.21
  NG : 32
  T: 60.0
  dt: 0.05
  Vt: 1
  nParticle: 100000
  Qm : -1
  alpha: 0.01
  testCase: bti
  ref: pif
  
profile:
  enableProfiler: false
  profiler: nsys
  profileDir: nsysProf
  evalOnly: true
  input_shape: [1,3,10000]   # relevant only if evalOnly=true or compile_eval=true
  use_amp: 0
  use_complex_amp: 0
  benchmark: true
  niter: 5
  compile_eval: 0       
  compile_train: 0
  compile_mode: default    # compiler mode 
 
